name: CI

on:
  pull_request:
    branches:
      - dev
      - main
      - hermes/dev-stabilization

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Prove production bundles exclude E2E fixtures
        run: npm run test:e2e:production-bundle

      - name: Prove E2E fixtures fail closed in production
        run: npm run test:e2e:production-safety

      - name: Install Playwright browser
        run: npm run test:e2e:install

      - name: End-to-end smoke
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
